# 容器内的 nginx 主配置。
#
# 这里整体替换 nginx 官方镜像自带的 /etc/nginx/nginx.conf，而不是去 sed
# 改它 —— 官方主配置的内容会随版本变化，sed 匹配不到时还会静默通过，
# 非 root 运行所需的 pid / 各级 temp 目录权限也就无从保证。自己完整写
# 一份，所有路径都显式指向非 root 可写的位置。
#
# server 块在 nginx.conf.template 里，由 entrypoint 渲染进 conf.d/。

# master 已以 uid 101 启动（Dockerfile 里的 USER），此处再声明 user 会触发
# "the user directive makes sense only if the master process runs with
# super-user privileges" 警告，故省略。
worker_processes  auto;

# /run 非 root 不可写，pid 放 /tmp
pid  /tmp/nginx.pid;

error_log  /dev/stderr  warn;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志直接进容器日志，便于 docker logs / 采集
    access_log  /dev/stdout;

    # 各级临时目录默认在 /var/cache/nginx，非 root 不可写，统一挪到 /tmp
    client_body_temp_path  /tmp/client_temp;
    proxy_temp_path        /tmp/proxy_temp;
    fastcgi_temp_path      /tmp/fastcgi_temp;
    uwsgi_temp_path        /tmp/uwsgi_temp;
    scgi_temp_path         /tmp/scgi_temp;

    sendfile          on;
    tcp_nopush        on;
    keepalive_timeout 65;

    # 由 entrypoint 从 templates/ 渲染出来的站点配置
    include /etc/nginx/conf.d/*.conf;
}
