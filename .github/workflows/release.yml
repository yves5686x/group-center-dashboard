name: Release

# 只在推送 v* tag 时触发，例如 v1.8.15。
# 开发期不跑，避免每次推 dev 都做一遍完整构建。
#
# 注意：checkout 必须显式 fetch tags 所在提交。默认分支是 main，而历史
# tag（含 v1.8.14）都只存在于 dev 上，直接 checkout 未必拿得到 tag 指向
# 的那份代码，会构建出错误的镜像。
on:
  push:
    tags:
      - 'v*'

# 权限最小化：只有推镜像和建 Release 需要 contents+packages 写权限
permissions:
  contents: write # 创建 GitHub Release
  packages: write # 推送到 GHCR

# 同一 tag 的重复触发（比如重跑）之间只保留最新一次
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: 构建并发布镜像
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          # 直接检出触发本次发布的那个 commit，
          # 不能用默认分支 —— 历史 tag 只存在于 dev 上
          ref: ${{ github.sha }}
          fetch-depth: 0

      # BuildKit 内置缓存，无需额外配置，能显著缩短重复构建时间
      - name: 配置 BuildKit 缓存
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # metadata-action 的 semver 会去掉 tag 的 v 前缀（v1.8.15 → 1.8.15），
      # 镜像标签用的是去掉 v 的版本号，所以 Release 正文里必须引用同一个值，
      # 直接写 github.ref_name 会得到 :v1.8.15 这个不存在的标签。
      - name: 校验 tag 与 package.json 版本一致
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 package.json 版本 ${PKG_VERSION} 不一致"
            exit 1
          fi
          echo "版本一致: $PKG_VERSION"
          echo "semver=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # 内置 token 有效期有限，无需手动配置
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v4

      # 冒烟测试：先构建成本地镜像、真的把容器跑起来验证，
      # 通过后才推送。构建能成功不代表能启动 —— 非 root 绑不了 80
      # 这种特权端口这类问题只有 run 起来才会暴露。
      - name: 构建本地镜像用于冒烟测试
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: gcd-smoke:local
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max

      - name: 启动容器并验证
        run: |
          set -euo pipefail
          # 后端地址指向一个不会连通的合法地址：这里只验证静态托管与 SPA
          # fallback，接口 502 属预期，不作为失败依据。
          # 注意不能用 127.0.0.1:9 —— nginx 会把 9 判为 invalid port 直接 emerg。
          docker run -d --name gcd-smoke -p 18080:8080 \
            -e BACKEND_URL=http://127.0.0.1:59999 gcd-smoke:local

          # 等 nginx 起来
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:18080/; then ready=1; break; fi
            # 容器提前退出就没必要继续等了，直接把原因打出来
            if ! docker ps --filter name=gcd-smoke --format '{{.Names}}' | grep -q gcd-smoke; then
              break
            fi
            sleep 1
          done

          if [ "$ready" != 1 ]; then
            {
              echo "### 容器未能对外提供服务"
              echo ""
              echo '```'
              echo "--- 容器状态 ---"
              docker inspect -f 'status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} err={{.State.Error}}' gcd-smoke 2>&1 || true
              echo "--- 容器日志 ---"
              docker logs gcd-smoke 2>&1 || true
              echo "--- 以 root 跑 nginx -t ---"
              docker run --rm --user 0 --entrypoint nginx gcd-smoke:local -t 2>&1 || true
              echo "--- 以 uid 101 跑 nginx -t ---"
              docker run --rm --user 101 --entrypoint nginx gcd-smoke:local -t 2>&1 || true
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::error::容器未能在 30s 内对外提供服务，详见 job summary"
            docker rm -f gcd-smoke || true
            exit 1
          fi

          fail=0
          check() {
            local path="$1" expect="$2" desc="$3"
            local code
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:18080${path}")
            if [ "$code" = "$expect" ]; then
              echo "  ok   ${path} → ${code} (${desc})"
            else
              echo "  FAIL ${path} → ${code}，期望 ${expect} (${desc})"
              fail=1
            fi
          }

          # 首页与 SPA history fallback：深层路由必须回落到 index.html
          check "/"            200 "首页"
          check "/home"        200 "首页路由"
          check "/gpu-dashboard" 200 "SPA fallback"
          check "/statistics"  200 "SPA fallback"
          check "/deep/unknown/route" 200 "SPA fallback"
          # 静态资源
          check "/umi.js"      200 "主脚本"
          check "/umi.css"     200 "主样式"
          check "/preload_helper.js" 200 "预载脚本"
          check "/not-exist.js" 404 "不存在的资源应为 404"

          # 容器健康状态
          hs=$(docker inspect -f '{{.State.Health.Status}}' gcd-smoke)
          echo "  健康状态: $hs"
          [ "$hs" = "healthy" ] || { echo "  FAIL 容器未 healthy"; fail=1; }

          # 确认确实以非 root 运行
          uid_in=$(docker exec gcd-smoke id -u)
          echo "  容器内 uid: $uid_in"
          [ "$uid_in" = "101" ] || { echo "  FAIL 期望非 root(101)，实际 $uid_in"; fail=1; }

          docker logs gcd-smoke 2>&1 | tail -20 || true
          docker rm -f gcd-smoke || true
          exit $fail

      - name: 推导镜像标签
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: 构建并推送镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            ## Docker

            ```bash
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.semver }}
            ```

            启动时通过 `BACKEND_URL` 指定后端地址（容器内 nginx 监听 8080，
            因为镜像以非 root 运行，绑不了 80 这种特权端口）：

            ```bash
            docker run -d -p 8080:8080 \
              -e BACKEND_URL=http://你的后端地址:15090 \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.semver }}
            ```
